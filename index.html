<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa de Moradias - Infralobo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      color: white;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Layout Responsivo para Mobile */
    @media (max-width: 768px) {
      body {
        flex-direction: column-reverse;
      }
      #sidebar {
        width: 100% !important;
        height: 40vh;
      }
      #map-container {
        height: 60vh;
      }
    }

    /* Painel Lateral */
    #sidebar {
      width: 360px;
      background: #252526;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .search-box {
      padding: 12px;
      background: #004b87;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #003360;
      background: #ffffff;
      color: #333;
      font-size: 14px;
      outline: none;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #e0e0e0;
    }

    .btn-toggle-all {
      background: #002b4d;
      color: #fff;
      border: 1px solid #005691;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }

    .btn-toggle-all:hover {
      background: #003f70;
    }

    .results-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .result-item {
      padding: 10px 12px;
      border-bottom: 1px solid #333;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .result-item:hover {
      background: #2a2d2e;
    }

    .result-item.active {
      background: #37373d;
      border-left: 4px solid #007acc;
    }

    .result-title {
      font-weight: bold;
      color: #4fc1ff;
      font-size: 13px;
    }

    .btn-gmaps {
      background: #28a745;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      font-size: 11px;
    }

    .btn-gmaps:hover {
      background: #218838;
    }

    /* Área do Mapa */
    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #121212;
      cursor: grab;
    }

    #map-container:active {
      cursor: grabbing;
    }

    .map-wrapper {
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
    }

    .map-wrapper img {
      display: block;
      pointer-events: none;
    }

    /* Marcadores Extremamente Pequenos (5px) */
    .pin {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #dc3545;
      border: 1px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s;
      z-index: 2;
    }

    .pin:hover {
      transform: translate(-50%, -50%) scale(2.5);
      z-index: 5;
    }

    .pin.selected {
      background: #ffc107;
      border-color: #000;
      transform: translate(-50%, -50%) scale(3);
      z-index: 10;
    }

    /* Etiqueta / Tooltip da Moradia com Botão Fechar */
    .pin-label {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
      border: 1px solid #555;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: labelFade 0.2s ease-out forwards;
      pointer-events: auto;
    }

    .close-label {
      cursor: pointer;
      color: #ff6b6b;
      font-weight: bold;
      font-size: 12px;
      line-height: 1;
      padding: 0 2px;
    }

    .close-label:hover {
      color: #ff0000;
    }

    @keyframes labelFade {
      0% { opacity: 0; transform: translate(-50%, 5px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Pesquisar moradia..." autocomplete="off">
      <div class="controls-bar">
        <span id="totalCount">0 moradias</span>
        <button class="btn-toggle-all" id="btnToggleAll">Ocultar Marcadores</button>
      </div>
    </div>
    <ul class="results-list" id="resultsList"></ul>
  </div>

  <div id="map-container">
    <div class="map-wrapper" id="mapWrapper">
      <img src="MAPA Infralobo.svg" alt="Mapa Infralobo" id="mapImage">
      <div id="pinsContainer"></div>
    </div>
  </div>

  <script>
    let dadosMoradias = [];
    let moradiaSelecionada = null;
    let marcadoresVisiveis = true;

    // Elementos DOM
    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const pinsContainer = document.getElementById('pinsContainer');
    const mapContainer = document.getElementById('map-container');
    const mapWrapper = document.getElementById('mapWrapper');
    const btnToggleAll = document.getElementById('btnToggleAll');
    const totalCount = document.getElementById('totalCount');

    // Variáveis de Zoom e Pan
    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    // 1. Carregar os dados do ficheiro JSON externo
    async function carregarDadosJSON() {
      try {
        const resposta = await fetch('dados.json');
        if (!resposta.ok) throw new Error('Erro ao carregar dados.json');
        dadosMoradias = await resposta.json();
        
        totalCount.textContent = `${dadosMoradias.length} moradias`;
        renderLista(dadosMoradias);
        renderPins(dadosMoradias);
      } catch (erro) {
        console.error('Erro:', erro);
        resultsList.innerHTML = '<li class="result-item" style="color: #ff6b6b;">Erro ao carregar o ficheiro dados.json</li>';
      }
    }

    function normalizarTexto(texto) {
      return texto.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function atualizarTransformacao() {
      mapWrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // Renderizar Marcadores no Mapa
    function renderPins(lista) {
      pinsContainer.innerHTML = '';

      if (!marcadoresVisiveis) return; // Se estiverem ocultos, não desenha nada

      lista.forEach((item) => {
        if (item.x !== null && item.y !== null) {
          const pin = document.createElement('div');
          pin.className = 'pin';

          if (moradiaSelecionada && moradiaSelecionada.moradia === item.moradia) {
            pin.classList.add('selected');
            
            // Etiqueta com Nome + Botão Fechar (✕)
            const label = document.createElement('div');
            label.className = 'pin-label';
            label.innerHTML = `
              <span>${item.moradia}</span>
              <span class="close-label" title="Fechar etiqueta">✕</span>
            `;

            // Ação de fechar a etiqueta
            label.querySelector('.close-label').addEventListener('click', (e) => {
              e.stopPropagation();
              moradiaSelecionada = null;
              renderPins(filtrarMoradias(searchInput.value));
              renderLista(filtrarMoradias(searchInput.value));
            });

            pin.appendChild(label);
          }

          pin.style.left = `${item.x}px`;
          pin.style.top = `${item.y}px`;

          pin.addEventListener('click', (e) => {
            e.stopPropagation();
            selecionarMoradia(item);
          });

          pinsContainer.appendChild(pin);
        }
      });
    }

    // Renderizar Lista Lateral
    function renderLista(lista) {
      resultsList.innerHTML = '';

      if (lista.length === 0) {
        resultsList.innerHTML = '<li class="result-item" style="color: #888;">Nenhuma moradia encontrada</li>';
        return;
      }

      lista.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'result-item';
        if (moradiaSelecionada && moradiaSelecionada.moradia === item.moradia) {
          li.classList.add('active');
        }

        const gmapsUrl = (item.lat && item.lng) 
          ? `https://www.google.com/maps?q=${item.lat},${item.lng}` 
          : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.moradia)}`;

        li.innerHTML = `
          <span class="result-title">${item.moradia}</span>
          <a href="${gmapsUrl}" target="_blank" class="btn-gmaps" onclick="event.stopPropagation()">📍 Google Maps</a>
        `;

        li.addEventListener('click', () => selecionarMoradia(item));
        resultsList.appendChild(li);
      });
    }

    // Selecionar Moradia, focar e abrir etiqueta
    function selecionarMoradia(item) {
      moradiaSelecionada = item;
      renderPins(filtrarMoradias(searchInput.value));
      renderLista(filtrarMoradias(searchInput.value));

      if (item.x !== null && item.y !== null) {
        const rect = mapContainer.getBoundingClientRect();
        scale = 1.8;
        pointX = (rect.width / 2) - (item.x * scale);
        pointY = (rect.height / 2) - (item.y * scale);
        atualizarTransformacao();
      }
    }

    // Filtrar Moradias na pesquisa
    function filtrarMoradias(termo) {
      const termoNorm = normalizarTexto(termo.trim());
      if (!termoNorm) return dadosMoradias;
      return dadosMoradias.filter(item => normalizarTexto(item.moradia).includes(termoNorm));
    }

    // Eventos de Pesquisa
    searchInput.addEventListener('input', (e) => {
      const resultados = filtrarMoradias(e.target.value);
      renderLista(resultados);
      renderPins(resultados);
    });

    // Alternar visibilidade de TODOS os marcadores
    btnToggleAll.addEventListener('click', () => {
      marcadoresVisiveis = !marcadoresVisiveis;
      btnToggleAll.textContent = marcadoresVisiveis ? 'Ocultar Marcadores' : 'Mostrar Marcadores';
      renderPins(filtrarMoradias(searchInput.value));
    });

    // --- Controlo de Zoom Centrado no Rato ---
    mapContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = mapContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const delta = -e.deltaY;
      const zoomFactor = delta > 0 ? 1.15 : 0.85;
      const newScale = Math.min(Math.max(scale * zoomFactor, 0.4), 6);

      pointX = mouseX - (mouseX - pointX) * (newScale / scale);
      pointY = mouseY - (mouseY - pointY) * (newScale / scale);
      scale = newScale;

      atualizarTransformacao();
    }, { passive: false });

    // --- Arrasto do Mapa (Pan) ---
    mapContainer.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      atualizarTransformacao();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Suporte para Tátil (Mobile)
    mapContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      }
    });

    mapContainer.addEventListener('touchmove', (e) => {
      if (isDragging && e.touches.length === 1) {
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        atualizarTransformacao();
      }
    });

    mapContainer.addEventListener('touchend', () => { isDragging = false; });

    // Iniciar a aplicação
    carregarDadosJSON();
  </script>
</body>
</html>
