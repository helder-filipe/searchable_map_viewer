<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Pesquisa de Moradias - Infralobo</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #1e1e1e; color: white; display: flex; flex-direction: column; height: 100vh; }

    header {
      background: #004b87;
      padding: 10px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 100;
    }

    .btn { padding: 8px 14px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-gmaps { background: #ea4335; }
    .btn-zoom { background: #6c757d; width: 36px; text-align: center; }

    .main-layout { display: flex; flex-grow: 1; overflow: hidden; }

    sidebar {
      width: 340px;
      background: #111;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .search-input:focus { border-color: #004b87; }

    .list-container {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0a0a0a;
    }

    .moradia-item {
      padding: 10px 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .moradia-item:hover { background: #1d2733; }
    
    .moradia-item.active {
      background: #004b87;
      color: white;
      font-weight: bold;
    }

    #map-viewport { 
      flex-grow: 1; 
      overflow: hidden; 
      position: relative; 
      background: #2b2b2b; 
      cursor: grab;
    }
    
    #map-viewport:active { cursor: grabbing; }

    #svg-wrapper { 
      position: absolute; 
      top: 0;
      left: 0;
      transform-origin: 0 0;
      display: inline-block; 
      transition: transform 0.05s ease-out;
    }
    
    svg { 
      display: block; 
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Estilos vectoriais dos Marcadores */
    .pin-circle {
      fill: #00ff66;
      stroke: #000000;
      stroke-width: 1.5px;
    }

    .pin-label-bg {
      fill: rgba(0, 0, 0, 0.85);
      rx: 2px;
      ry: 2px;
    }

    .pin-label-text {
      fill: #00ff66;
      font-size: 9px;
      font-family: system-ui, sans-serif;
      font-weight: 500;
      user-select: none;
      pointer-events: none;
    }

    /* Marcador em Destaque (Pesquisa Selecionada) */
    .highlight-pin {
      fill: #ff0055;
      stroke: #ffffff;
      stroke-width: 2.5px;
    }

    .highlight-label-bg {
      fill: #ff0055;
      rx: 3px;
      ry: 3px;
    }

    .highlight-label-text {
      fill: #ffffff;
      font-size: 11px;
      font-family: system-ui, sans-serif;
      font-weight: bold;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <span><strong>Localizador de Moradias</strong></span>
    <button id="zoom-in" class="btn btn-zoom" title="Aumentar Zoom">+</button>
    <button id="zoom-out" class="btn btn-zoom" title="Diminuir Zoom">-</button>
    <button id="zoom-reset" class="btn btn-zoom" style="width: auto;" title="Repor Zoom">Reset</button>
    <button id="gmaps-btn" class="btn btn-gmaps" title="Ver no Google Maps">Ver no Google Maps 📍</button>
    <span id="status-msg">A carregar ficheiros...</span>
  </header>

  <div class="main-layout">
    <sidebar>
      <h3>Pesquisa</h3>
      <input type="text" id="search-box" class="search-input" placeholder="Digite a moradia (ex: 8 A)..." autofocus />
      <div id="moradias-list" class="list-container"></div>
    </sidebar>

    <div id="map-viewport">
      <div id="svg-wrapper">
        <div id="svg-holder"></div>
      </div>
    </div>
  </div>

  <script>
    const listContainer = document.getElementById('moradias-list');
    const svgHolder = document.getElementById('svg-holder');
    const wrapper = document.getElementById('svg-wrapper');
    const viewport = document.getElementById('map-viewport');
    const statusMsg = document.getElementById('status-msg');
    const gmapsBtn = document.getElementById('gmaps-btn');
    const searchBox = document.getElementById('search-box');

    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomResetBtn = document.getElementById('zoom-reset');

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    let moradiasData = [];
    let selectedIndex = -1;
    let svgLayerGroup = null;

    async function init() {
      try {
        statusMsg.innerText = 'A carregar mapa e dados...';
        
        // Carregamento simultâneo do SVG e do JSON
        const [svgRes, jsonRes] = await Promise.all([
          fetch('MAPA Infralobo.svg'),
          fetch('dados.json')
        ]);

        if (!svgRes.ok) throw new Error('Não foi possível carregar "MAPA Infralobo.svg"');
        if (!jsonRes.ok) throw new Error('Não foi possível carregar "dados.json"');

        const svgText = await svgRes.text();
        moradiasData = await jsonRes.json();

        // Renderiza SVG
        svgHolder.innerHTML = svgText;
        const svgEl = svgHolder.querySelector('svg');

        if (svgEl) {
          svgLayerGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          svgLayerGroup.setAttribute('id', 'dynamic-pins-layer');
          svgEl.appendChild(svgLayerGroup);
        }

        setupPanAndZoom();
        setupSearch();
        renderList(moradiasData);
        renderPins();

        statusMsg.innerText = `${moradiasData.length} moradias carregadas.`;
      } catch (err) {
        console.error(err);
        statusMsg.innerText = `Erro: ${err.message}`;
      }
    }

    function renderList(data) {
      listContainer.innerHTML = '';

      data.forEach((item) => {
        const originalIndex = moradiasData.indexOf(item);
        const div = document.createElement('div');
        div.className = `moradia-item ${originalIndex === selectedIndex ? 'active' : ''}`;
        
        div.innerHTML = `<span>${item.moradia || item.id}</span>`;

        div.addEventListener('click', () => {
          selectMoradia(originalIndex);
        });

        listContainer.appendChild(div);
      });
    }

    function selectMoradia(index) {
      selectedIndex = index;
      const item = moradiasData[index];
      
      renderList(getFilteredData());
      renderPins();

      if (item && item.x !== undefined && item.y !== undefined) {
        centerMapOnPoint(item.x, item.y);
      }
    }

    function getFilteredData() {
      const q = searchBox.value.toLowerCase().trim();
      if (!q) return moradiasData;
      return moradiasData.filter(i => (i.moradia || i.id).toLowerCase().includes(q));
    }

    function setupSearch() {
      searchBox.addEventListener('input', () => {
        const filtered = getFilteredData();
        renderList(filtered);

        // Se houver apenas 1 resultado na pesquisa, seleciona-o automaticamente
        if (filtered.length === 1) {
          const idx = moradiasData.indexOf(filtered[0]);
          selectMoradia(idx);
        }
      });

      gmapsBtn.addEventListener('click', () => {
        if (selectedIndex >= 0) {
          const item = moradiasData[selectedIndex];
          if (item.lat && item.lng) {
            window.open(`https://www.google.com/maps?q=${item.lat},${item.lng}`, '_blank');
          } else {
            alert('Coordenadas GPS não disponíveis para este item.');
          }
        }
      });
    }

    function renderPins() {
      if (!svgLayerGroup) return;
      svgLayerGroup.innerHTML = '';

      moradiasData.forEach((item, index) => {
        if (item.x !== undefined && item.y !== undefined) {
          const isSelected = index === selectedIndex;
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.setAttribute('class', 'pin-group');

          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', item.x);
          circle.setAttribute('cy', item.y);
          circle.setAttribute('r', isSelected ? '7' : '4');
          circle.setAttribute('class', isSelected ? 'highlight-pin' : 'pin-circle');

          const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', item.x + (isSelected ? 10 : 7));
          text.setAttribute('y', item.y + 3);
          text.setAttribute('class', isSelected ? 'highlight-label-text' : 'pin-label-text');
          text.textContent = item.moradia || item.id;

          const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bg.setAttribute('class', isSelected ? 'highlight-label-bg' : 'pin-label-bg');

          labelGroup.appendChild(bg);
          labelGroup.appendChild(text);

          g.appendChild(circle);
          g.appendChild(labelGroup);

          g.addEventListener('click', (e) => {
            e.stopPropagation();
            selectMoradia(index);
          });

          svgLayerGroup.appendChild(g);

          const textBounds = text.getBBox();
          bg.setAttribute('x', textBounds.x - 2);
          bg.setAttribute('y', textBounds.y - 1);
          bg.setAttribute('width', textBounds.width + 4);
          bg.setAttribute('height', textBounds.height + 2);
        }
      });
    }

    function centerMapOnPoint(x, y) {
      const viewportRect = viewport.getBoundingClientRect();
      scale = 4; // Zoom confortável para ver a moradia focada

      translateX = (viewportRect.width / 2) - (x * scale);
      translateY = (viewportRect.height / 2) - (y * scale);
      updateTransform();
    }

    function updateTransform() {
      wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function zoomAtPoint(factor, clientX, clientY) {
      const viewportRect = viewport.getBoundingClientRect();
      const pivotX = clientX !== undefined ? (clientX - viewportRect.left) : (viewportRect.width / 2);
      const pivotY = clientY !== undefined ? (clientY - viewportRect.top) : (viewportRect.height / 2);

      const newScale = Math.min(Math.max(0.2, scale * factor), 15);
      
      translateX = pivotX - (pivotX - translateX) * (newScale / scale);
      translateY = pivotY - (pivotY - translateY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }

    function setupPanAndZoom() {
      zoomInBtn.addEventListener('click', () => zoomAtPoint(1.3));
      zoomOutBtn.addEventListener('click', () => zoomAtPoint(1 / 1.3));
      zoomResetBtn.addEventListener('click', () => { scale = 1; translateX = 0; translateY = 0; updateTransform(); });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAtPoint(factor, e.clientX, e.clientY);
      }, { passive: false });

      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });
    }

    init();
  </script>
</body>
</html>
