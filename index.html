<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Localizador de Moradias - Infralobo</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #1e1e1e; color: white; display: flex; flex-direction: column; height: 100vh; }

    header {
      background: #004b87;
      padding: 10px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 100;
    }

    .btn { padding: 8px 14px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-zoom { background: #6c757d; width: 36px; text-align: center; }

    .main-layout { display: flex; flex-grow: 1; overflow: hidden; }

    sidebar {
      width: 340px;
      background: #111;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus { border-color: #004b87; }

    .list-container {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0a0a0a;
    }

    .moradia-item {
      padding: 10px 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .moradia-item:hover { background: #1d2733; }
    
    .moradia-item.active {
      background: #004b87;
      color: white;
      font-weight: bold;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gmaps-link {
      color: #ea4335;
      text-decoration: none;
      font-size: 13px;
      padding: 2px 5px;
      border: 1px solid #ea4335;
      border-radius: 3px;
      transition: all 0.2s ease;
    }

    .gmaps-link:hover {
      background: #ea4335;
      color: #fff;
    }

    #map-viewport { 
      flex-grow: 1; 
      overflow: hidden; 
      position: relative; 
      background: #2b2b2b; 
      cursor: grab;
    }
    
    #map-viewport:active { cursor: grabbing; }

    #svg-wrapper { 
      position: absolute; 
      top: 0;
      left: 0;
      transform-origin: 0 0;
      display: inline-block; 
      transition: transform 0.05s ease-out;
    }
    
    svg { 
      display: block; 
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* Animação executada APENAS 1 vez no marcador (Valores reduzidos a 25%) */
    @keyframes pulsePinOnce {
      0% { r: 1.25px; stroke-width: 0.5px; }
      50% { r: 3px; stroke-width: 1px; }
      100% { r: 1.75px; stroke-width: 0.5px; }
    }

    .search-pin-circle {
      fill: #ff0055;
      stroke: #ffffff;
      animation: pulsePinOnce 1s ease-out 1 forwards;
    }

    .search-label-bg {
      fill: #ff0055;
      rx: 1px;
      ry: 1px;
    }

    .search-label-text {
      fill: #ffffff;
      font-size: 2.75px;
      font-family: system-ui, sans-serif;
      font-weight: bold;
      user-select: none;
      pointer-events: none;
    }

    /* Botão X para fechar a etiqueta (Tamanho reduzido a 25%) */
    .close-btn-bg {
      fill: #000000;
      opacity: 0.3;
      cursor: pointer;
      rx: 0.5px;
      ry: 0.5px;
    }

    .close-btn-bg:hover {
      fill: #ffffff;
      opacity: 0.4;
    }

    .close-btn-text {
      fill: #ffffff;
      font-size: 2.5px;
      font-family: system-ui, sans-serif;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <header>
    <span><strong>Localizador de Moradias</strong></span>
    <button id="zoom-in" class="btn btn-zoom" title="Aumentar Zoom">+</button>
    <button id="zoom-out" class="btn btn-zoom" title="Diminuir Zoom">-</button>
    <button id="zoom-reset" class="btn btn-zoom" style="width: auto;" title="Repor Zoom">Reset</button>

    <span id="progress-status">A carregar dados...</span>
  </header>

  <div class="main-layout">
    <sidebar>
      <h3>Pesquisa</h3>
      <input type="text" id="search-box" class="search-input" placeholder="Pesquisar moradia (ex: VDL 8 A)..." autofocus />
      <div id="moradias-list" class="list-container"></div>
    </sidebar>

    <div id="map-viewport">
      <div id="svg-wrapper">
        <div id="svg-holder"></div>
      </div>
    </div>
  </div>

  <script>
    const listContainer = document.getElementById('moradias-list');
    const svgHolder = document.getElementById('svg-holder');
    const wrapper = document.getElementById('svg-wrapper');
    const viewport = document.getElementById('map-viewport');
    const progressStatus = document.getElementById('progress-status');
    const searchBox = document.getElementById('search-box');

    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomResetBtn = document.getElementById('zoom-reset');

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    let listData = [];
    let selectedIndex = -1;
    let svgLayerGroup = null;

    async function init() {
      try {
        progressStatus.innerText = 'A carregar ficheiros...';

        const [svgRes, jsonRes] = await Promise.all([
          fetch('MAPA Infralobo.svg'),
          fetch('dados.json')
        ]);

        if (!svgRes.ok) throw new Error('Não foi possível carregar MAPA Infralobo.svg');
        if (!jsonRes.ok) throw new Error('Não foi possível carregar dados.json');

        const svgText = await svgRes.text();
        listData = await jsonRes.json();

        svgHolder.innerHTML = svgText;
        const svgEl = svgHolder.querySelector('svg');

        if (svgEl) {
          svgLayerGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          svgLayerGroup.setAttribute('id', 'dynamic-pins-layer');
          svgEl.appendChild(svgLayerGroup);
        }

        setupPanAndZoom();
        setupSearch();
        renderList();
        renderPins();

        progressStatus.innerText = `${listData.length} moradias carregadas.`;
      } catch (err) {
        console.error(err);
        progressStatus.innerText = `Erro: ${err.message}`;
      }
    }

    function updateTransform() {
      wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function zoomAtPoint(factor, clientX, clientY) {
      const viewportRect = viewport.getBoundingClientRect();
      const pivotX = clientX !== undefined ? (clientX - viewportRect.left) : (viewportRect.width / 2);
      const pivotY = clientY !== undefined ? (clientY - viewportRect.top) : (viewportRect.height / 2);

      const newScale = Math.min(Math.max(0.2, scale * factor), 15);
      
      translateX = pivotX - (pivotX - translateX) * (newScale / scale);
      translateY = pivotY - (pivotY - translateY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }

    function centerMapOnPoint(x, y) {
      const viewportRect = viewport.getBoundingClientRect();
      scale = 3.5;

      translateX = (viewportRect.width / 2) - (x * scale);
      translateY = (viewportRect.height / 2) - (y * scale);
      updateTransform();
    }

    function openGoogleMaps(lat, lng) {
      if (!lat || !lng) {
        alert('Coordenadas GPS não disponíveis.');
        return;
      }
      window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
    }

    function setupPanAndZoom() {
      zoomInBtn.addEventListener('click', () => zoomAtPoint(1.3));
      zoomOutBtn.addEventListener('click', () => zoomAtPoint(1 / 1.3));
      zoomResetBtn.addEventListener('click', () => { scale = 1; translateX = 0; translateY = 0; updateTransform(); });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAtPoint(factor, e.clientX, e.clientY);
      }, { passive: false });

      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });
    }

    function setupSearch() {
      searchBox.addEventListener('input', () => {
        renderList();
      });
    }

    function renderList() {
      listContainer.innerHTML = '';
      const filterQuery = searchBox.value.toLowerCase().trim();

      listData.forEach((item, index) => {
        const moradiaNome = item.moradia || item.id;
        
        if (filterQuery && !moradiaNome.toLowerCase().includes(filterQuery)) {
          return;
        }

        const div = document.createElement('div');
        div.className = `moradia-item ${index === selectedIndex ? 'active' : ''}`;
        
        div.innerHTML = `
          <span>${moradiaNome}</span>
          <div class="item-right">
            <a href="#" class="gmaps-link" title="Abrir no Google Maps">📍</a>
          </div>
        `;

        const gmapsLink = div.querySelector('.gmaps-link');
        gmapsLink.addEventListener('click', (e) => {
          e.stopPropagation();
          openGoogleMaps(item.lat, item.lng);
        });

        div.addEventListener('click', () => {
          selectedIndex = index;
          renderList();
          renderPins();

          if (item.x !== undefined && item.y !== undefined) {
            centerMapOnPoint(item.x, item.y);
          }
        });

        listContainer.appendChild(div);
      });

      const activeEl = listContainer.querySelector('.moradia-item.active');
      if (activeEl) {
        activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    function deselectMoradia() {
      selectedIndex = -1;
      renderList();
      renderPins();
    }

    function renderPins() {
      if (!svgLayerGroup) return;
      svgLayerGroup.innerHTML = '';

      // Renderiza EXCLUSIVAMENTE a moradia pesquisada com elementos a 25% da dimensão original
      if (selectedIndex >= 0 && selectedIndex < listData.length) {
        const item = listData[selectedIndex];
        if (item.x !== undefined && item.y !== undefined && item.x !== null && item.y !== null) {
          const highlightGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          highlightGroup.setAttribute('class', 'search-highlight-group');

          // Raio reduzido de 7px para 1.75px
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', item.x);
          circle.setAttribute('cy', item.y);
          circle.setAttribute('r', '1.75');
          circle.setAttribute('class', 'search-pin-circle');

          const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

          // Deslocamentos (offsets) e tamanho de fonte reduzidos para 25%
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', item.x + 3);
          text.setAttribute('y', item.y + 1);
          text.setAttribute('class', 'search-label-text');
          text.textContent = item.moradia || item.id;

          const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bg.setAttribute('class', 'search-label-bg');

          // Botão X reduzido
          const closeBg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          closeBg.setAttribute('class', 'close-btn-bg');

          const closeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          closeText.setAttribute('class', 'close-btn-text');
          closeText.textContent = '✕';

          const closeHandler = (e) => {
            e.stopPropagation();
            deselectMoradia();
          };

          closeBg.addEventListener('click', closeHandler);
          closeText.addEventListener('click', closeHandler);

          labelGroup.appendChild(bg);
          labelGroup.appendChild(text);
          labelGroup.appendChild(closeBg);
          labelGroup.appendChild(closeText);

          highlightGroup.appendChild(circle);
          highlightGroup.appendChild(labelGroup);

          svgLayerGroup.appendChild(highlightGroup);

          // Ajustes proporcionais de margem e caixa para fechar
          const textBounds = text.getBBox();
          const closeWidth = 3.5; // (14px * 0.25)
          const paddingRight = closeWidth + 1.5;

          bg.setAttribute('x', textBounds.x - 0.75);
          bg.setAttribute('y', textBounds.y - 0.5);
          bg.setAttribute('width', textBounds.width + paddingRight);
          bg.setAttribute('height', textBounds.height + 1);

          const closeX = textBounds.x + textBounds.width + 0.75;
          const closeY = textBounds.y - 0.25;

          closeBg.setAttribute('x', closeX);
          closeBg.setAttribute('y', closeY);
          closeBg.setAttribute('width', 3);
          closeBg.setAttribute('height', 3);

          closeText.setAttribute('x', closeX + 0.5);
          closeText.setAttribute('y', closeY + 2.4);
        }
      }
    }

    init();
  </script>
</body>
</html>
